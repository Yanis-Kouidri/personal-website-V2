name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Containerfile with Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Containerfile

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check formatting with Prettier
        run: bun run check

      - name: Lint with ESLint
        run: bun run lint

      - name: Check Typescript
        run: bun run typecheck

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-push:
    name: Build and push Podman image
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract metadata (version & image name)
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$OWNER_LC/$REPO_NAME_LC" >> "$GITHUB_OUTPUT"

      - name: Connect to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build podman image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ steps.meta.outputs.image }}
          context: .
          platforms: linux/amd64
          tags: |
            latest
            ${{ steps.meta.outputs.version }}
            sha-${{ github.sha }}
          containerfiles: |
            ./Containerfile

      - name: Export image to archive
        run: buildah push ${{ steps.build-image.outputs.image-with-tag }} docker-archive:image.tar:${{ steps.build-image.outputs.image-with-tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io

      - name: Verify build status
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "Image built and pushed on GHCR."
            echo "Image pushed:"
            echo "${{ steps.meta.outputs.image }}:latest"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}"
          else
            echo "Image built but not pushed (tests PR)"
          fi
