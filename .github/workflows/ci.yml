name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Containerfile with Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Check formatting with Prettier
        run: bun run format

      - name: Lint with ESLint
        run: bun run lint

      - name: Check Typescript
        run: bun run typecheck

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  build-and-push:
    name: Build and push Podman image
    needs: [quality-check, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract metadata (version & image name)
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$OWNER_LC/$REPO_NAME_LC" >> "$GITHUB_OUTPUT"

      - name: Connect to GitHub Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build podman image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ steps.meta.outputs.image }}
          context: .
          platforms: linux/amd64
          tags: |
            latest
            ${{ steps.meta.outputs.version }}
            sha-${{ github.sha }}
          containerfiles: |
            ./Containerfile

      - name: Export image to archive
        run: buildah push ${{ steps.build-image.outputs.image-with-tag }} docker-archive:image.tar:${{ steps.build-image.outputs.image-with-tag }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          # Documented, time-boxed exceptions for vulnerabilities that can only
          # be fixed upstream (e.g. Go dependencies of the Caddy binary)
          trivyignores: .trivyignore.yaml

      - name: Smoke test container
        run: |
          podman run -d --name smoke-test -p 8080:8080 ${{ steps.build-image.outputs.image-with-tag }}

          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/healthz -o /dev/null; then
              echo "Container responded successfully."
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Container did not respond after 10 attempts."
              podman logs smoke-test
              exit 1
            fi
            sleep 1
          done

          podman stop smoke-test

      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ghcr.io

      - name: Verify build status
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "Image built and pushed on GHCR."
            echo "Image pushed:"
            echo "${{ steps.meta.outputs.image }}:latest"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.image }}:sha-${{ github.sha }}"
          else
            echo "Image built but not pushed (tests PR)"
          fi
